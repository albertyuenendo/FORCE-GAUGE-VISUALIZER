  "#e6194b","#3cb44b","#ffe119","#4363d8",
  "#f58231","#911eb4","#46f0f0","#f032e6",
  "#bcf60c","#fabebe","#008080","#e6beff"
];

document.getElementById("csvFiles").addEventListener("change", handleFiles);
document.getElementById("openPopupBtn").addEventListener("click", openGraphWindow);
document.getElementById("exportBtn").addEventListener("click", exportAverageCSV);

function parseCSV(text){
  let rows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r.length > 0);
  let data = [];
  rows.forEach(line => {
    let parts = line.split(",");
    let y = parseFloat(parts[1] ?? parts[0]);
    if(!isNaN(y)) data.push(y);
  });
  return data;
}

// Populate reference dropdown on startup
Object.entries(preloadedRawTexts).forEach(([name, csvText]) => {
  referenceDatasets[name] = parseCSV(csvText);
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  referenceSelect.appendChild(option);
});

function handleFiles(e){
  const files = Array.from(e.target.files);
  statusMsg.textContent = "";
  datasetsRaw = new Array(files.length);
  fileNames = new Array(files.length);
  fileListDiv.innerHTML = "";

  files.forEach((file, index) => {
    fileNames[index] = file.name;
    fileListDiv.innerHTML += `<div>• ${file.name}</div>`;
    const reader = new FileReader();
    reader.onload = function(event){
      datasetsRaw[index] = parseCSV(event.target.result);
    };
    reader.readAsText(file);
  });
}

function movingAverage(data, windowSize){
  if (windowSize <= 1) return data;
  let result = [];
  for (let i=0; i<data.length; i++){
    let start = Math.max(0, i-windowSize+1);
    let subset = data.slice(start, i+1);
    let avg = subset.reduce((a,b)=>a+b,0)/subset.length;
    result.push(avg);
  }
  return result;
}

function downsample(data){
  const maxPoints = 2000;
  if (data.length <= maxPoints) return data;
  let step = Math.ceil(data.length/maxPoints);
  return data.filter((_,i)=> i%step===0);
}

function generateXValues(length){
  let xStart = parseFloat(xStartInput.value);
  let xEnd = parseFloat(xEndInput.value);
  if(isNaN(xStart) || isNaN(xEnd) || length < 2) return [];
  let step = (xEnd - xStart) / (length-1);
  let values = [];
  for(let i=0; i<length; i++) values.push(xStart + step*i);
  return values.reverse();
}

function openGraphWindow(){
  const selectedRefName = referenceSelect.value;
  const activeReferenceRaw = selectedRefName ? referenceDatasets[selectedRefName] : null;
  const validDatasets = datasetsRaw.filter(d => Array.isArray(d) && d.length > 0);

  if(!validDatasets.length && !activeReferenceRaw){
    statusMsg.className = "mt-2 text-sm text-red-600";
    statusMsg.textContent = "Please select Test CSV files or a Reference Curve first.";
    return;
  }
  statusMsg.textContent = "";

  popupCounter++;
  const modelTitle = modelTitleInput.value.trim() || `Graph #${popupCounter}`;
  const winName = `ForceGraph_${popupCounter}_${Date.now()}`;
  const popup = window.open("", winName, "width=1100,height=740,resizable=yes,scrollbars=yes");

  if (!popup) {
    statusMsg.className = "mt-2 text-sm text-red-600";
    statusMsg.textContent = "Pop-up blocked! Please allow pop-ups for this site in your browser bar.";
    return;
  }

  const payload = {
    title: modelTitle,
    datasetsRaw: datasetsRaw,
    fileNames: fileNames,
    referenceDatasets: referenceDatasets,
    selectedRefName: selectedRefName,
    xStart: parseFloat(xStartInput.value) || 0,
    xEnd: parseFloat(xEndInput.value) || 100,
    smoothLevel: SMOOTH_LEVEL,
    showAverage: false,
    colorPalette: colorPalette
  };

  const safePayloadJSON = JSON.stringify(payload).replace(/<\/script>/gi, "<\\/script>");
  const closeScript = "</" + "script>";

  const popupHTML = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${modelTitle} - Force Gauge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js">${closeScript}
<script src="https://cdn.tailwindcss.com">${closeScript}
</head>
<body class="bg-gray-100 p-4 flex flex-col h-screen">
  <div class="bg-white p-4 rounded shadow mb-3 flex flex-wrap items-center justify-between gap-4">
    <div>
      <span class="text-xs font-bold uppercase text-gray-400">MODEL</span>
      <h1 class="text-xl font-bold text-gray-800">${modelTitle}</h1>
    </div>
    <div class="flex flex-wrap items-center gap-4 text-sm">
      <label class="inline-flex items-center gap-1.5 font-medium text-gray-700">
        <input type="checkbox" id="pAvg"> Show Average
      </label>
      <div class="flex items-center gap-1.5">
        <span class="font-medium text-gray-700">Reference:</span>
        <select id="pRef" class="border border-gray-300 p-1 rounded bg-white">
          <option value="">None</option>
        </select>
      </div>
      <button id="saveGraphBtn" class="bg-indigo-600 text-white px-4 py-1.5 rounded shadow hover:bg-indigo-700 font-semibold">
        Save Graph (PNG)
      </button>
    </div>
  </div>

  <div class="bg-white p-4 rounded shadow flex-1 flex flex-col min-h-0">
    <div class="flex-1 relative min-h-0" style="min-height: 400px;">
      <canvas id="popupCanvas"></canvas>
    </div>
    <div id="pStats" class="mt-3 pt-2 border-t border-gray-200 text-xs text-gray-700 flex flex-wrap gap-4"></div>
  </div>

  <script>
    const state = ${safePayloadJSON};
    let chart;

    const pAvg = document.getElementById("pAvg");
    const pRef = document.getElementById("pRef");
    const pStats = document.getElementById("pStats");

    Object.keys(state.referenceDatasets).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if (name === state.selectedRefName) opt.selected = true;
      pRef.appendChild(opt);
    });

    function movingAverage(data, windowSize){
      if (windowSize <= 1) return data;
      let result = [];
      for (let i=0; i<data.length; i++){
        let start = Math.max(0, i-windowSize+1);
        let subset = data.slice(start, i+1);
        let avg = subset.reduce((a,b)=>a+b,0)/subset.length;
        result.push(avg);
      }
      return result;
    }

    function downsample(data){
      const maxPoints = 2000;
      if (data.length <= maxPoints) return data;
      let step = Math.ceil(data.length/maxPoints);
      return data.filter((_,i)=> i%step===0);
    }

    function generateXValues(length){
      if(length < 2) return [];
      let step = (state.xEnd - state.xStart) / (length-1);
      let values = [];
      for(let i=0; i<length; i++) values.push(state.xStart + step*i);
      return values.reverse();
    }

    const whiteBackgroundPlugin = {
      id: "customCanvasBackgroundColor",
      beforeDraw: (chart) => {
        const ctx = chart.canvas.getContext("2d");
        ctx.save();
        ctx.globalCompositeOperation = "destination-over";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, chart.width, chart.height);
        ctx.restore();
      }
    };

    function render(){
      if (typeof Chart === "undefined") {
        setTimeout(render, 100);
        return;
      }

      const smoothLevel = state.smoothLevel;
      const datasets = [];
      let statsHTML = "";

      state.datasetsRaw.forEach((data, i) => {
        if (!Array.isArray(data) || !data.length) return;
        let smoothed = movingAverage(downsample(data), smoothLevel);
        let xVals = generateXValues(smoothed.length);
        let peak = Math.max(...smoothed);
        let min = Math.min(...smoothed);
        statsHTML += \`<div><strong>\${state.fileNames[i]}</strong>: Peak \${peak.toFixed(3)} | Min \${min.toFixed(3)}</div>\`;
        datasets.push({
          label: state.fileNames[i],
          data: smoothed.map((y, idx) => ({x: xVals[idx], y: y})),
          borderColor: state.colorPalette[i % state.colorPalette.length],
          borderWidth: 2,
          pointRadius: 0
        });
      });

      if (pAvg.checked && state.datasetsRaw.length > 1){
        let minLen = Math.min(...state.datasetsRaw.map(d => d.length));
        let avgRaw = [];
        for(let i=0; i<minLen; i++){
          let sum = 0;
          state.datasetsRaw.forEach(d => sum += d[i]);
          avgRaw.push(sum / state.datasetsRaw.length);
        }
        let avgProcessed = movingAverage(downsample(avgRaw), smoothLevel);
        let xVals = generateXValues(avgProcessed.length);
        datasets.push({
          label: "Average",
          data: avgProcessed.map((y, idx) => ({x: xVals[idx], y: y})),
          borderColor: "black",
          borderWidth: 4,
          pointRadius: 0
        });
      }

      const refName = pRef.value;
      if (refName && state.referenceDatasets[refName]){
        let smoothed = movingAverage(downsample(state.referenceDatasets[refName]), smoothLevel);
        let xVals = generateXValues(smoothed.length);
        datasets.push({
          label: \`Reference (\${refName})\`,
          data: smoothed.map((y, idx) => ({x: xVals[idx], y: y})),
          borderColor: "purple",
          borderDash: [6,6],
          borderWidth: 3,
          pointRadius: 0
        });
      }

      pStats.innerHTML = statsHTML;
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("popupCanvas"), {
        type: "line",
        data: {datasets: datasets},
        plugins: [whiteBackgroundPlugin],
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          interaction: {mode: "nearest", intersect: false},
          plugins: {
            title: {
              display: true,
              text: state.title,
              font: { size: 16, weight: "bold" },
              padding: { bottom: 12 }
            }
          },
          scales: {
            x: {type: "linear", title: {display: true, text: "Length"}},
            y: {title: {display: true, text: "Force"}}
          }
        }
      });
    }

    document.getElementById("saveGraphBtn").addEventListener("click", () => {
      if (!chart) return;
      const safeName = state.title.replace(/[<>:"/\\|?*]+/g, "_");
      const link = document.createElement("a");
      link.download = \`\${safeName}_graph.png\`;
      link.href = chart.toBase64Image("image/png", 1.0);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    pAvg.addEventListener("change", render);
    pRef.addEventListener("change", render);
    window.addEventListener("load", render);
    render();
  ${closeScript}
</body>
</html>`;

  popup.document.open();
  popup.document.write(popupHTML);
  popup.document.close();
}

function exportAverageCSV(){
  if(datasetsRaw.length < 2){
    statusMsg.className = "mt-2 text-sm text-red-600";
    statusMsg.textContent = "Need at least 2 files to export average.";
    return;
  }

  let customName = document.getElementById("exportFileName").value.trim();
  let modelName = modelTitleInput.value.trim();
  let fileName = customName || (modelName ? `${modelName}_average` : "average_processed_data");
  fileName = fileName.replace(/[<>:"/\\|?*]+/g, "_");
  if (!fileName.toLowerCase().endsWith(".csv")) fileName += ".csv";

  let minLen = Math.min(...datasetsRaw.map(d=>d.length));
  let avgRaw = [];
  for(let i=0; i<minLen; i++){
    let sum = 0;
    datasetsRaw.forEach(d => sum += d[i]);
    avgRaw.push(sum/datasetsRaw.length);
  }

  let avgProcessed = movingAverage(downsample(avgRaw), SMOOTH_LEVEL);
  let xVals = generateXValues(avgProcessed.length);
  let csvRows = ["Length,Average"];
  for(let i=0; i<avgProcessed.length; i++) csvRows.push(xVals[i]+","+avgProcessed[i]);

  let blob = new Blob([csvRows.join("\n")], {type: "text/csv"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  statusMsg.className = "mt-2 text-sm text-green-700";
  statusMsg.textContent = `Exported: ${fileName}`;
}
</script>
</body>
</html>
